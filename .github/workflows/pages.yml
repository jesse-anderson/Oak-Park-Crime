name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy via GitHub Pages REST API (robust)
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "==> Listing artifacts for this run (${RUN_ID})..."
          artifacts_json="$(gh api -H "Accept: application/vnd.github+json" \
            "/repos/${OWNER}/${REPO}/actions/runs/${RUN_ID}/artifacts")"

          artifact_url="$(echo "${artifacts_json}" | jq -r '
            .artifacts
            | map(select(.name == "github-pages"))
            | .[0].archive_download_url // empty
          ')"

          if [[ -z "${artifact_url}" ]]; then
            echo "ERROR: Could not find artifact named 'github-pages' for this run."
            echo "Raw artifacts JSON:"
            echo "${artifacts_json}"
            exit 1
          fi

          echo "Artifact archive_download_url: ${artifact_url}"

          echo "==> Requesting OIDC token..."
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "ERROR: Missing ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN. Check permissions: id-token: write"
            exit 1
          fi

          oidc_json="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"

          oidc_token="$(echo "${oidc_json}" | jq -r '.value // empty')"
          if [[ -z "${oidc_token}" ]]; then
            echo "ERROR: OIDC token response did not contain '.value'."
            echo "Raw OIDC JSON:"
            echo "${oidc_json}"
            exit 1
          fi
          echo "::add-mask::${oidc_token}"

          echo "==> Creating Pages deployment for SHA=${SHA} ..."
          create_resp="$(gh api -X POST -H "Accept: application/vnd.github+json" \
            "/repos/${OWNER}/${REPO}/pages/deployments" \
            -f artifact_url="${artifact_url}" \
            -f environment="github-pages" \
            -f pages_build_version="${SHA}" \
            -f oidc_token="${oidc_token}")"

          echo "Create response: ${create_resp}"

          deployment_id="$(echo "${create_resp}" | jq -r '.id // empty')"
          page_url="$(echo "${create_resp}" | jq -r '.page_url // empty')"

          if [[ -z "${deployment_id}" ]]; then
            echo "ERROR: Create deployment response missing 'id'."
            exit 1
          fi

          echo "Deployment id: ${deployment_id}"
          if [[ -n "${page_url}" ]]; then
            echo "Page URL: ${page_url}"
          fi

          echo "==> Polling deployment status..."
          max_seconds=900
          interval=5
          elapsed=0
          blank_count=0

          while true; do
            status_json="$(gh api -H "Accept: application/vnd.github+json" \
              "/repos/${OWNER}/${REPO}/pages/deployments/${deployment_id}" || true)"

            status="$(echo "${status_json}" | jq -r '.status // empty' 2>/dev/null || true)"

            ts="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "${ts} status='${status}'"

            if [[ -z "${status}" ]]; then
              blank_count=$((blank_count + 1))
              if (( blank_count == 5 )); then
                echo "WARNING: Received 5 blank status responses. Raw response:"
                echo "${status_json}"
              fi
            else
              blank_count=0
            fi

            case "${status}" in
              succeed|success)
                echo "✅ Pages deployment succeeded."
                break
                ;;
              failed|error|failure)
                echo "❌ Pages deployment failed. Raw status response:"
                echo "${status_json}"
                exit 1
                ;;
              cancelled|canceled)
                echo "⚠️ Pages deployment canceled."
                exit 1
                ;;
              *)
                # queued / in_progress / empty / unknown
                ;;
            esac

            if (( elapsed >= max_seconds )); then
              echo "⏱️ Timeout waiting for Pages deployment after ${max_seconds}s."
              echo "Attempting to cancel deployment ${deployment_id}..."
              gh api -X POST -H "Accept: application/vnd.github+json" \
                "/repos/${OWNER}/${REPO}/pages/deployments/${deployment_id}/cancel" || true
              exit 1
            fi

            sleep "${interval}"
            elapsed=$((elapsed + interval))
          done
